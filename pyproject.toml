[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scpolish"
version = "0.1.0.dev0"
description = "Publication-ready single-cell figures with minimal code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "scPolish contributors" }]
dependencies = [
  "anndata>=0.10",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "scanpy>=1.10",
  "seaborn>=0.13",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/scpolish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
